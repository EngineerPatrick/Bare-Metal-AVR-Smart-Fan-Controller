name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
     
      - name: Install build requirements
        run: |
          sudo apt update
          sudo apt install -y gcc-avr avr-libc=1:2.2.1-1build1 binutils-avr
     
      - name: Compile
        run: |
          make clean
          make all
